<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waypoint Freight – global cargo globe</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#03050a;--ink:#e8ecf5;--mute:#8591a8;--line:rgba(160,180,255,.15);--pane:rgba(8,12,22,.74);--hot:#ff5a4f;--gold:#ffcf8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 60% 45%,#0b1226,var(--bg) 70%);color:var(--ink);font:13px/1.45 Manrope,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pl{position:absolute;left:0;top:0;font-size:10px;color:#c9d3ea;opacity:.8;white-space:nowrap;text-shadow:0 0 5px #000,0 0 2px #000}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glass{background:var(--pane);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px)}
#hud{position:fixed;left:18px;top:calc(18px + env(safe-area-inset-top,0px));width:300px;max-height:calc(100% - 100px);overflow:auto;padding:16px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em}.brand span{color:var(--gold);font-weight:600;margin-left:7px}
#kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.k{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.k b{display:block;font:500 17px "JetBrains Mono",monospace}.k small{color:var(--mute);font-size:11px}
.h{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.cg{display:block;width:100%;padding:5px 0}.cg.off{opacity:.35}
.cg .t{display:flex;justify-content:space-between;gap:8px}.cg .t i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.cg .t em{font:500 12px "JetBrains Mono",monospace;font-style:normal}
.tr{height:4px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}.tr i{display:block;height:100%}
.fine{color:var(--mute);font-size:11px;margin:12px 0 0}
#card{position:fixed;right:18px;top:calc(18px + env(safe-area-inset-top,0px));width:330px;max-height:calc(100% - 100px);overflow:auto;padding:18px}
#card[hidden]{display:none}
#card h2{margin:4px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em}
#card .tag{font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.05em}
#card .rt{color:var(--mute);margin-bottom:10px}
#x{position:absolute;right:10px;top:8px;font-size:20px;color:var(--mute);padding:4px 8px}
.pb{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.pb i{display:block;height:100%;background:var(--gold)}
.sm{color:var(--mute);font-size:11px;margin:5px 0 10px}
dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:7px 8px}dt{color:var(--mute)}dd{margin:0;font:12px "JetBrains Mono",monospace;word-break:break-word}
.lg{display:flex;gap:14px;margin-top:12px;color:var(--mute);font-size:11px;align-items:center}
.lg i{display:inline-block;width:22px;height:0;margin-right:6px;vertical-align:middle}
.fl{margin-top:12px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:inline-block}
.fl[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;padding:8px 12px}
#clock{font:500 13px "JetBrains Mono",monospace;padding:0 8px}
#bar button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:12px}
#bar button.on{color:#1a1205;background:var(--gold);border-color:var(--gold)}
@media (max-width:760px){
#hud{left:10px;right:10px;width:auto;max-height:36%;padding:12px}#kpi{margin:8px 0}.hide-m{display:none}
#card{left:10px;right:10px;width:auto;top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-height:42%}
#bar{width:calc(100% - 20px);justify-content:space-between;gap:4px;padding:6px 8px}#clock{font-size:11px;padding:0}#bar button{padding:5px 8px;font-size:11px}
}
</style>
</head>

  <div id="lane" class="hide-m"></div>

</div>

function place(s){

  if(ph<s.dur){d=ph*s.sp;s.state='sea'}else{d=s.len=s.P.len;s.state='port'}
  s.dep=T-Math.min(ph,s.dur+DWELL)*36e5;s.eta=s.dep+s.dur*36e5;s.d=d;
  const c=s.P.cum;let lo=0,hi=c.length-1;while(hi-lo>1){const m=(lo+hi)>>1;c[m]<=d?lo=m:hi=m}
  const f=c[hi]>c[lo]?Math.min(1,Math.max(0,(d-c[lo])/(c[hi]-c[lo]))):0,a=s.P.vs[lo],b=s.P.vs[hi];
  const v=a.clone().lerp(b,f).normalize();s.idx=lo+(f>.5?1:0);s.vec=v;s.pos.copy(v).multiplyScalar(R*1.007);
  const[la1,lo1]=latlon(a),[la2,lo2]=latlon(b),dl=(lo2-lo1)*D,y=Math.sin(dl)*Math.cos(la2*D),x=Math.cos(la1*D)*Math.sin(la2*D)-Math.sin(la1*D)*Math.cos(la2*D)*Math.cos(dl);
  s.hd=(Math.atan2(y,x)/D+360)%360;s.prog=d/s.P.len;
  s.past.geometry.setDrawRange(0,Math.max(2,s.idx+1));s.fut.geometry.setDrawRange(s.idx,s.P.vs.length-s.idx);
}
const colA=sc.constructor;
function paint(){
  ships.forEach((s,i)=>{const k=s.on?1:.1;sc.set([s.col.r*k,s.col.g*k,s.col.b*k],i*3);ss[i]=s===sel?.3:.17;s.past.visible=s.on;s.past.material.opacity=s===sel?1:.5});
  shipPts.geometry.attributes.aColor.needsUpdate=true;shipPts.geometry.attributes.aSize.needsUpdate=true;
}

// ---------- HUD ----------
const money=v=>v>=1e9?'$'+(v/1e9).toFixed(2)+'B':'$'+Math.round(v/1e6).toLocaleString()+'M';
const utc=t=>new Date(t).toISOString().slice(0,16).replace('T',' ')+' UTC';
const fmtLL=(a,o)=>Math.abs(a).toFixed(2)+'°'+(a>=0?'N':'S')+' '+Math.abs(o).toFixed(2)+'°'+(o>=0?'E':'W');
function hud(){
  const on=ships.filter(s=>s.on),sea=on.filter(s=>s.state==='sea'),val=sea.reduce((a,s)=>a+s.value,0),tons=sea.reduce((a,s)=>a+s.tons,0);
  $('#kpi').innerHTML=[['Vessels tracked',on.length+' / '+ships.length],['Underway',sea.length],['Cargo afloat',money(val)],['Tonnage afloat',(tons/1e6).toFixed(2)+' Mt']].map(k=>'<div class="k"><small>'+k[0]+'</small><b>'+k[1]+'</b></div>').join('');
  const tot=ships.reduce((a,s)=>a+s.value,0);
  $('#cg').innerHTML=Object.keys(CG).map(k=>{const g=CG[k],l=ships.filter(s=>s.ck===k),v=l.reduce((a,s)=>a+s.value,0),off=!l[0].on;
    return '<button class="cg'+(off?' off':'')+'" data-k="'+k+'" aria-pressed="'+!off+'"><div class="t"><span><i style="background:'+g.c+'"></i>'+g.n+' · '+l.length+'</span><em>'+money(v)+'</em></div><div class="tr"><i style="width:'+(v/tot*100)+'%;background:'+g.c+'"></i></div></button>'}).join('');
  const su=ships.filter(s=>s.rk==='SUEZ').length,ca=ships.filter(s=>s.rk==='CAPE').length;
  $('#lane').innerHTML='<div class="tr" style="height:8px"><i style="width:'+su/(su+ca)*100+'%;background:#7aa2ff;float:left"></i><i style="width:'+ca/(su+ca)*100+'%;background:#ff8a4f;float:left"></i></div><div class="sm" style="margin:6px 0 0"><span style="color:#7aa2ff">Suez '+su+'</span> · <span style="color:#ff8a4f">Cape '+ca+'</span> in this fleet. Industry-wide, about 63% of Far East–Europe container capacity was back on Suez routings by mid-October 2026 (Alphaliner). The Cape detour adds roughly 4,000 nm.</div>';
  $('#clock').textContent=utc(T);
  if(sel)cardShip();else if(selPort)cardPort();
}
function cardShip(){
  const s=sel,[la,lo]=latlon(s.vec),pct=(s.prog*100).toFixed(1),dayv=s.value/((s.dur)/24);
  $('#card').innerHTML='<button id="x" aria-label="Close">×</button><div class="tag" style="color:'+s.cg.c+'">'+s.cg.n+' · '+esc(s.rt.via)+'</div><h2>'+esc(s.name)+'</h2><div class="rt">'+esc(s.from)+' → '+esc(s.to)+'</div>'
  +'<div class="pb"><i style="width:'+pct+'%"></i></div><div class="sm">'+pct+'% · '+Math.round(s.d).toLocaleString()+' of '+Math.round(s.P.len).toLocaleString()+' nm</div><dl>'
  +'<dt>Status</dt><dd>'+(s.state==='sea'?'Underway':'Discharging at '+esc(s.to))+'</dd>'
  +'<dt>Cargo</dt><dd>'+s.qty.toLocaleString()+' '+s.cg.u+' of '+s.cg.n.toLowerCase()+'</dd>'
  +'<dt>Est. value</dt><dd>'+money(s.value)+'</dd><dt>Price basis</dt><dd>'+s.cg.pl+'</dd>'
  +'<dt>Position</dt><dd>'+fmtLL(la,lo)+'</dd><dt>Heading / speed</dt><dd>'+Math.round(s.hd)+'° · '+(s.state==='sea'?s.sp:0)+' kn</dd>'
  +'<dt>Departed</dt><dd>'+utc(s.dep)+'</dd><dt>Arrives</dt><dd>'+utc(s.eta)+'</dd><dt>Transit time</dt><dd>'+(s.dur/24).toFixed(1)+' days</dd>'
  +'<dt>Value in motion</dt><dd>'+money(dayv)+' per day at sea</dd></dl>'
  +'<div class="lg"><span><i style="border-top:2px solid '+s.cg.c+'"></i>Past track</span><span><i style="border-top:2px dashed #aab"></i>Planned</span></div>'
  +'<button class="fl" id="fl" aria-pressed="'+follow+'">Follow vessel</button>';
}
function cardPort(){
  const k=selPort,o=PORTS[k],bound=ships.filter(s=>s.rt.f===k||s.rt.t===k);
  $('#card').innerHTML='<button id="x" aria-label="Close">×</button><div class="tag" style="color:var(--gold)">Port</div><h2>'+esc(o[0])+'</h2><div class="rt">'+fmtLL(o[1],o[2])+'</div><dl><dt>2025 container volume</dt><dd>'+(o[3]?o[3].toFixed(2)+' million TEU':'Not loaded here')+'</dd><dt>Vessels calling</dt><dd>'+(bound.length?bound.map(s=>esc(s.name)).join(', '):'None in this fleet')+'</dd></dl>';
}
function pick(s,p){sel=s;selPort=p||null;ring.visible=!!s;$('#card').hidden=!(s||p);follow=!!s;if(s||p){const t=s?s.vec:ll(PORTS[p][1],PORTS[p][2],1);const[la,lo]=latlon(t);fly={x:la*D,y:-lo*D,z:s?11:11.5}}paint();hud()}
$('#cg').addEventListener('click',e=>{const b=e.target.closest('.cg');if(!b)return;const k=b.dataset.k,on=ships.find(s=>s.ck===k).on;ships.forEach(s=>{if(s.ck===k)s.on=!on});if(sel&&!sel.on)pick(null);paint();hud()});
$('#card').addEventListener('click',e=>{if(e.target.id==='x')pick(null);if(e.target.id==='fl'){follow=!follow;if(follow&&sel)fly={x:latlon(sel.vec)[0]*D,y:-latlon(sel.vec)[1]*D,z:11};hud()}});
$('#pp').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
document.querySelectorAll('#bar [data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('#bar [data-s]').forEach(x=>x.classList.toggle('on',x===b))});

// ---------- camera + interaction ----------
let rx=.5,ry=-.35,tz=17,fly=null,drag=false,idle=true,dn=null;group.rotation.set(rx,ry,0);cam.position.z=tz;
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();US.s.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(cam.fov*Math.PI/360));
  cam.setViewOffset(innerWidth,innerHeight,innerWidth>760?innerWidth*.06:0,innerWidth>760?0:-innerHeight*.08,innerWidth,innerHeight)}
addEventListener('resize',resize);
const v3=new V3(),cp=new V3();
let last=performance.now(),hudT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1e3);last=now;
  if(!paused)T+=dt*1e3*speed;GU.uTime.value=now/1e3;GU.uSun.value.copy(sunDir(T));
  ships.forEach(place);
  ships.forEach((s,i)=>sp.set([s.pos.x,s.pos.y,s.pos.z],i*3));shipPts.geometry.attributes.position.needsUpdate=true;
  if(fly){let dy=fly.y-group.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));group.rotation.y+=dy*.07;group.rotation.x+=(fly.x-group.rotation.x)*.07;tz+=(fly.z-tz)*.05;if(!follow&&Math.abs(dy)<.003&&Math.abs(tz-fly.z)<.05)fly=null}
  if(follow&&sel){const[la,lo]=latlon(sel.vec);fly={x:la*D,y:-lo*D,z:11}}
  else if(idle&&!drag&&!sel&&!selPort)group.rotation.y+=Math.cos(now/4000)*.0004;
  cam.position.z=innerWidth<760?tz+3:tz;
  group.updateMatrixWorld();globe.worldToLocal(cp.copy(cam.position));GU.uCam.value.copy(cp);
  if(sel){ring.position.copy(sel.pos);ring.quaternion.setFromUnitVectors(new V3(0,0,1),sel.pos.clone().normalize());const k=(now/1100)%1;ring.scale.setScalar(.08+k*.22);ring.material.opacity=1-k}
  const w=innerWidth,h=innerHeight,cpw=cam.position;
  PK.forEach((k,i)=>{const o=PORTS[k];v3.copy(ll(o[1],o[2],R)).applyMatrix4(group.matrixWorld);const vis=v3.dot(cpw)>R*R*1.02&&(o[3]||tz<14);const l=plab[i];l.style.display=vis?'':'none';
    if(vis){v3.project(cam);l.style.transform='translate('+((v3.x*.5+.5)*w+6)+'px,'+((-v3.y*.5+.5)*h-5)+'px)'}});
  renderer.render(scene,cam);
  if(now-hudT>400){hudT=now;hud()}
  requestAnimationFrame(frame);
}
stage.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,m:0};drag=true;idle=false;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.lx,dy=e.clientY-dn.ly;dn.lx=e.clientX;dn.ly=e.clientY;dn.m+=Math.abs(dx)+Math.abs(dy);
  if(dn.m>5){fly=null;follow=false}const k=.004*tz/17;group.rotation.y+=dx*k;group.rotation.x=Math.max(-1.4,Math.min(1.4,group.rotation.x+dy*k))});
stage.addEventListener('pointerup',e=>{drag=false;
  if(dn&&dn.m<6){let best=null,bd=26,bp=null;const w=innerWidth,h=innerHeight;
    const test=(wp,o,port)=>{v3.copy(wp).applyMatrix4(group.matrixWorld);if(v3.dot(cam.position)<R*R)return;v3.project(cam);const d=Math.hypot((v3.x*.5+.5)*w-e.clientX,(-v3.y*.5+.5)*h-e.clientY);if(d<bd){bd=d;if(port){bp=o;best=null}else{best=o;bp=null}}};
    PK.forEach(k=>test(ll(PORTS[k][1],PORTS[k][2],R),k,true));ships.forEach(s=>{if(s.on)test(s.pos,s,false)});
    if(best)pick(best);else if(bp)pick(null,bp);else pick(null)}
  dn=null});
stage.addEventListener('wheel',e=>{e.preventDefault();tz=Math.max(8,Math.min(30,tz+e.deltaY*.015));if(fly)fly.z=tz},{passive:false});

resize();ships.forEach(place);paint();hud();
pick(ships[0]);
requestAnimationFrame(frame);
})();
</script>
</body>
